
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>.</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: fixed;
            inset: 0;
        }

        body {
            cursor: none;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline>
        <source src="/video.mp4" type="video/mp4">
    </video>

</body>
</html>
